<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bristol Exploration Game</title>
    
    <!-- PWA Requirements -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1b263b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Leaflet CSS Asset -->
    <link rel="stylesheet" href="https://unpkg.com" crossorigin="" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body, #map {
            width: 100%;
            height: 100%;
            background-color: #0d1b2a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        /* Native app interface overlays */
        #ui-layer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 400px;
            background: rgba(13, 27, 42, 0.95);
            border: 2px solid #415a77;
            border-radius: 12px;
            padding: 15px;
            color: #e0e1dd;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            pointer-events: auto;
        }
        .status-text {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #778da9;
        }
        .coord-display {
            font-family: monospace;
            font-size: 12px;
            color: #00b4d8;
        }
    </style>
</head>
<body>

    <!-- Leaflet Map Container -->
    <div id="map"></div>

    <!-- UI Overlay for Realtime Telemetry Tracking -->
    <div id="ui-layer">
        <div class="status-text" id="gps-status">Initializing Satellite Sync...</div>
        <div class="coord-display" id="gps-coords">Lat: 0.00000 | Lon: 0.00000</div>
    </div>

    <!-- Core App Injection Pipeline -->
    <script src="https://unpkg.com" crossorigin=""></script>
    <script type="module" src="./src/main.ts"></script>
</body>
</html>
