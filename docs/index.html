<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bristol Exploration Game</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1b263b">
    
    <!-- Self-hosted Leaflet CSS -->
    <link rel="stylesheet" href="./lib/leaflet/leaflet.css" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body, #map {
            width: 100%;
            height: 100%;
            background-color: #0d1b2a;
            font-family: sans-serif;
            overflow: hidden;
        }
        #ui-layer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 400px;
            background: rgba(13, 27, 42, 0.95);
            border: 2px solid #415a77;
            border-radius: 12px;
            padding: 15px;
            color: #e0e1dd;
            text-align: center;
        }
        .status-text { font-size: 14px; font-weight: bold; margin-bottom: 5px; color: #00b4d8; }
        .coord-display { font-family: monospace; font-size: 12px; color: #e0e1dd; }
        #start-btn {
            margin-top: 10px;
            padding: 8px 16px;
            background: #00b4d8;
            color: #0d1b2a;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="ui-layer">
        <div class="status-text" id="gps-status">Loading Map Engine...</div>
        <div class="coord-display" id="gps-coords">Lat: -- | Lon: --</div>
        <button id="start-btn">Start GPS Tracking</button>
    </div>

    <!-- Self-hosted Leaflet JS -->
    <script src="./lib/leaflet/leaflet.js"></script>
    <script>
        const statusDisplay = document.getElementById('gps-status');
        const coordDisplay = document.getElementById('gps-coords');
        const startBtn = document.getElementById('start-btn');

        window.onerror = function(msg, url, line) {
            statusDisplay.style.color = "#e63946";
            statusDisplay.textContent = "JS Error: " + msg + " (Line " + line + ")";
        };

        // Wait until local Leaflet script has fully loaded
        window.addEventListener('load', () => {
            if (typeof L === 'undefined') {
                statusDisplay.style.color = "#e63946";
                statusDisplay.textContent = "Map library not found at ./lib/leaflet/leaflet.js";
                return;
            }

            // 1. Initialize Leaflet Map locked to Bristol
            const BRISTOL_BOUNDS = L.latLngBounds([51.4000, -2.6800], [51.5200, -2.5000]);
            const map = L.map('map', {
                center: [51.4545, -2.5879],
                zoom: 15,
                minZoom: 12,
                maxZoom: 19,
                maxBounds: BRISTOL_BOUNDS,
                maxBoundsViscosity: 1.0,
                zoomControl: false
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            // 2. Render Collectibles
            const MOCK_COLLECTIBLES = [
                { name: "Castle Park Fountain Token", lat: 51.4548, lng: -2.5872, tier: "global" },
                { name: "SS Great Britain Maritime Shard", lat: 51.4484, lng: -2.6083, tier: "global" },
                { name: "Clifton Suspension Bridge Medal", lat: 51.4549, lng: -2.6279, tier: "global" },
                { name: "Gloucester Road Indie Coin", lat: 51.4772, lng: -2.5891, tier: "personal" },
                { name: "BS5 Local Sandbox Anchor", lat: 51.4580, lng: -2.5530, tier: "personal" }
            ];

            MOCK_COLLECTIBLES.forEach(item => {
                L.circle([item.lat, item.lng], {
                    radius: 20,
                    color: item.tier === 'global' ? '#ffb703' : '#fb8500',
                    fillOpacity: 0.4
                }).addTo(map).bindPopup(`<b>${item.name}</b>`);
            });

            let playerMarker = null;
            let accuracyCircle = null;

            function startGPS() {
                if (!('geolocation' in navigator)) {
                    statusDisplay.textContent = "Geolocation not supported.";
                    return;
                }

                statusDisplay.textContent = "Requesting Android GPS...";
                statusDisplay.style.color = "#ffb703";

                navigator.geolocation.watchPosition(
                    (pos) => {
                        const { latitude, longitude, accuracy } = pos.coords;
                        const currentPos = L.latLng(latitude, longitude);

                        statusDisplay.textContent = "GPS Connected";
                        statusDisplay.style.color = "#4ad66d";
                        coordDisplay.textContent = `Lat: ${latitude.toFixed(5)} | Lon: ${longitude.toFixed(5)} (±${Math.round(accuracy)}m)`;
                        startBtn.style.display = "none";

                        if (!playerMarker) {
                            playerMarker = L.circleMarker(currentPos, {
                                radius: 8, color: '#fff', fillColor: '#00b4d8', fillOpacity: 1, weight: 3
                            }).addTo(map);
                            accuracyCircle = L.circle(currentPos, {
                                radius: accuracy, color: '#00b4d8', fillOpacity: 0.15, weight: 1
                            }).addTo(map);
                            map.setView(currentPos, 16);
                        } else {
                            playerMarker.setLatLng(currentPos);
                            accuracyCircle.setLatLng(currentPos).setRadius(accuracy);
                        }
                    },
                    (err) => {
                        statusDisplay.style.color = "#e63946";
                        statusDisplay.textContent = `GPS Error (${err.code}): ${err.message}`;
                    },
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 }
                );
            }

            startBtn.addEventListener('click', startGPS);
            startGPS();
        });
    </script>
</body>
</html>
