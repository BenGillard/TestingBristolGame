<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bristol Exploration Game</title>
    
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1b263b">
    <link rel="apple-touch-icon" href="assets/icon-192.png">

    <!-- Self-Hosted Leaflet CSS (verify path matches your folder structure) -->
    <link rel="stylesheet" href="./lib/leaflet/leaflet.css" />
    
    <!-- Game Styles -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- Top Inventory Bar -->
    <div id="inventory-bar">
        <div class="res-slot">
            <div class="res-label">🪨 Stone</div>
            <div class="res-count" id="count-stone">0</div>
        </div>
        <div class="res-slot">
            <div class="res-label">🪵 Wood</div>
            <div class="res-count" id="count-wood">0</div>
        </div>
        <div class="res-slot">
            <div class="res-label">💧 Water</div>
            <div class="res-count" id="count-water">0</div>
        </div>
        <div class="res-slot">
            <div class="res-label">⚙️ Metal</div>
            <div class="res-count" id="count-metal">0</div>
        </div>
    </div>

    <!-- Fullscreen Map Container -->
    <div id="map"></div>

    <!-- Recentre on Player Button -->
    <button id="recentre-btn" title="Recentre on Player" aria-label="Recentre on Player">🎯</button>

    <!-- Bottom Status & Action UI -->
    <div id="ui-layer">
        <div class="status-text" id="gps-status">Loading Map Engine...</div>
        <div class="coord-display" id="gps-coords">Lat: -- | Lon: --</div>
        <div class="refresh-info" id="refresh-status">Personal spawns refresh daily at 4:00 PM</div>
        <button class="action-btn" id="start-btn">Start GPS Tracking</button>
        <button class="action-btn" id="claim-btn">Claim Resource</button>
    </div>

    <!-- Self-Hosted Leaflet JS (verify path matches your folder structure) -->
    <script src="./lib/leaflet/leaflet.js"></script>
    
    <!-- Game Modules -->
    <script src="collectibles.js"></script>
    <script src="game.js"></script>
</body>
</html>
